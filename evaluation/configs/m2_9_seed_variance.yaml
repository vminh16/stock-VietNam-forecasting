schema_version: m2_5_zero_shot_screen_v1
dataset_id: vn150_strict_v2
dataset_dir: data/curated/vn150_strict_v2
dataset_manifest_path: reports/milestone_1_data/vn150_strict_v2/dataset_manifest.json
registry_path: data/evaluation/m2_1/common_origins.csv.gz
registry_manifest_path: reports/milestone_2_research_eval/origin_registry/manifest.json
tokenizer_path: pretrained/Kronos-Tokenizer-base
output_dir: data/evaluation/m2_9
report_dir: reports/milestone_2_research_eval/seed_variance
horizon: 5
# The same 196 dates as the M2.7 confirmation run, so the spread measured here
# is directly comparable to the intervals those dates already produced.
date_stride: 10
date_residues: [2, 5]
sampling:
  sample_count: 10
  seed: 20260901
  temperature: 0.6
  top_k: 0
  top_p: 0.9
runtime:
  max_context: 512
  clip: 5.0
  batch_size: 2
# Five replicates of one arm. Every field below is identical across them, and
# the per-origin seed is sha256(seed | arm_id | origin_date), so the arm_id is
# the only thing that varies and it varies nothing but the RNG stream.
arms:
  - arm_id: small_l126_r1
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
  - arm_id: small_l126_r2
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
  - arm_id: small_l126_r3
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
  - arm_id: small_l126_r4
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
  - arm_id: small_l126_r5
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
