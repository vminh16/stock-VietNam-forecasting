schema_version: m2_3_paired_inference_v1
input_dirs:
  - data/evaluation/m2_7
  - data/evaluation/m2_2
report_dir: reports/milestone_2_research_eval/confirmation/paired_inference
restrict_dates_to: small_l126
comparisons:
  # PRIMARY. The registered non-inferiority margin of SPEC 8.6 rule 4, read on
  # RankIC only. This run exists to make that margin testable.
  - {left: small_l126, right: base_l126}
  # Naive gate, SPEC 8.6 rule 5. The first of these was omitted from the M2.5
  # registration and was deliberately left uncomputed rather than added later.
  - {left: small_l126, right: recent_return_bootstrap}
  - {left: base_l126, right: recent_return_bootstrap}
  # Zero-information floor, secondary.
  - {left: small_l126, right: persistence}
  - {left: base_l126, right: persistence}
bootstrap:
  method: stationary
  mean_block_dates: 10
  replicates: 5000
  confidence: 0.95
  seed: 20260901
