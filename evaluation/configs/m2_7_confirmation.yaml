schema_version: m2_5_zero_shot_screen_v1
dataset_id: vn150_strict_v2
dataset_dir: data/curated/vn150_strict_v2
dataset_manifest_path: reports/milestone_1_data/vn150_strict_v2/dataset_manifest.json
registry_path: data/evaluation/m2_1/common_origins.csv.gz
registry_manifest_path: reports/milestone_2_research_eval/origin_registry/manifest.json
tokenizer_path: pretrained/Kronos-Tokenizer-base
output_dir: data/evaluation/m2_7
report_dir: reports/milestone_2_research_eval/confirmation
horizon: 5
# The M2.5 screen took date classes {0 mod 10}. This run takes {2, 5 mod 10},
# so its 196 dates share no date with the run that selected these two arms.
date_stride: 10
date_residues: [2, 5]
sampling:
  sample_count: 10
  seed: 20260901
  temperature: 0.6
  top_k: 0
  top_p: 0.9
runtime:
  max_context: 512
  clip: 5.0
  batch_size: 2
arms:
  - arm_id: small_l126
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
  - arm_id: base_l126
    model_path: pretrained/Kronos-base
    lookback: 126
    normalizer_lookback: 126
