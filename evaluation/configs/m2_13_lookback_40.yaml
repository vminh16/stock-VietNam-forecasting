schema_version: m2_5_zero_shot_screen_v1
dataset_id: vn150_strict_v2
dataset_dir: data/curated/vn150_strict_v2
dataset_manifest_path: reports/milestone_1_data/vn150_strict_v2/dataset_manifest.json
registry_path: data/evaluation/m2_1/common_origins.csv.gz
registry_manifest_path: reports/milestone_2_research_eval/origin_registry/manifest.json
tokenizer_path: pretrained/Kronos-Tokenizer-base
output_dir: data/evaluation/m2_13
report_dir: reports/milestone_2_research_eval/lookback_40
horizon: 5
# The 98 M2.5 screen dates. This is a screen and those dates are already spent on
# selection, so it must not touch the 683 dates M2.10 reads its gates on. Every
# M2.5 arm ran on this same machine, so the comparison set is host-clean.
date_stride: 10
date_residues: [0]
# Identical to m2_5_zero_shot_screen.yaml in every sampling and runtime field.
sampling:
  sample_count: 10
  seed: 20260901
  temperature: 0.6
  top_k: 0
  top_p: 0.9
runtime:
  max_context: 512
  clip: 5.0
  batch_size: 2
arms:
  - arm_id: small_l40
    model_path: pretrained/Kronos-small
    lookback: 40
    normalizer_lookback: 40
  - arm_id: small_l40_norm126
    model_path: pretrained/Kronos-small
    lookback: 40
    normalizer_lookback: 126
