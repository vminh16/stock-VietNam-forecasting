schema_version: m2_5_zero_shot_screen_v1
dataset_id: vn150_strict_v2
dataset_dir: data/curated/vn150_strict_v2
dataset_manifest_path: reports/milestone_1_data/vn150_strict_v2/dataset_manifest.json
registry_path: data/evaluation/m2_1/common_origins.csv.gz
registry_manifest_path: reports/milestone_2_research_eval/origin_registry/manifest.json
tokenizer_path: pretrained/Kronos-Tokenizer-base
output_dir: data/evaluation/m2_12
report_dir: reports/milestone_2_research_eval/local_baseline
horizon: 5
# The 98 M2.5 screen dates. This run re-measures an arm that has already been
# read on them, so it spends no unused date.
date_stride: 10
date_residues: [0]
# Every field below is identical to m2_5_zero_shot_screen.yaml, arm_id included.
# arm_id feeds the per-origin seed hash, so keeping it fixed means this run draws
# the same RNG stream as the L4 run and the only difference is the host.
sampling:
  sample_count: 10
  seed: 20260901
  temperature: 0.6
  top_k: 0
  top_p: 0.9
runtime:
  max_context: 512
  clip: 5.0
  batch_size: 2
arms:
  - arm_id: small_l126
    model_path: pretrained/Kronos-small
    lookback: 126
    normalizer_lookback: 126
