  - {left: small_l126, right: short_term_reversal}
  - {left: base_l126, right: short_term_reversal}
  - {left: small_l126, right: momentum_126_21}
  - {left: base_l126, right: momentum_126_21}
bootstrap:
  method: stationary
  mean_block_dates: 10
  replicates: 5000
  confidence: 0.95
  seed: 20260901
